<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adressen sorteren</title>
<style>
  :root{
    --bg:#eef3ec;--card:#ffffff;--ink:#14281f;--mute:#5d7367;--line:#d3dfd5;
    --acc:#2e7d3f;--acc-ink:#ffffff;--hot:#e0593f;--soft:#e3eee4;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0e1d17;--card:#162b23;--ink:#eaf3ec;--mute:#8fa89a;--line:#244036;
    --acc:#9bd24b;--acc-ink:#10210f;--hot:#ff8a6b;--soft:#1d372d;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px 16px 40px}
  main{max-width:560px;margin:0 auto}
  header{display:flex;align-items:center;gap:12px;margin:6px 0 22px}
  .logo{width:44px;height:44px;border-radius:50%;background:var(--card);border:6px solid var(--acc);position:relative;flex:none}
  .logo::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--hot)}
  h1{font-size:1.5rem;line-height:1.15;margin:0;letter-spacing:-.01em}
  h1 small{display:block;font-size:.85rem;font-weight:500;color:var(--mute);margin-top:2px;letter-spacing:0}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 16px 18px}
  label{display:block;font-weight:600;margin:14px 0 6px}
  input,textarea,select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
  textarea{min-height:150px;resize:vertical}
  input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
  button{padding:12px 18px;border:0;border-radius:12px;background:var(--acc);color:var(--acc-ink);font:inherit;font-weight:700;cursor:pointer}
  button.sec{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
  button.big{width:100%;padding:16px;font-size:1.05rem;border-radius:14px}
  button:disabled{opacity:.5;cursor:wait}
  #status{color:var(--mute);margin:14px 2px 0;min-height:1.5em}
  #maps{margin-top:14px}
  ol{padding:0;margin:18px 0 0;list-style:none;counter-reset:n}
  li{counter-increment:n;display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
  li::before{content:counter(n);flex:none;width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--acc);font-weight:700;font-size:.9rem;display:grid;place-items:center}
  li:first-child::before{background:var(--acc);color:var(--acc-ink)}
  li .km{margin-left:auto;color:var(--mute);white-space:nowrap;text-align:right;font-size:.92rem}
  li.err{border-color:var(--hot)}
  li.err::before{content:"!";background:var(--hot);color:#fff}
  .add{display:flex;gap:8px}
  .add input{flex:1}
  .add button{flex:none;padding:12px 16px}
  .hint{color:var(--mute);font-size:.88rem;margin:6px 2px 0}
  ul.chips{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:6px}
  ul.chips li{counter-increment:none;margin:0;padding:8px 8px 8px 14px;border-radius:12px;background:var(--bg);gap:8px}
  ul.chips li::before{content:none}
  ul.chips li span{flex:1;overflow-wrap:anywhere}
  ul.chips button{background:transparent;color:var(--mute);padding:4px 10px;font-size:1.2rem;line-height:1;border-radius:8px}
  .count{font-weight:600;margin:16px 0 0}
  ul.chips li span{cursor:text}
  ul.chips li input.edit{flex:1;padding:7px 10px;border-radius:8px}
  ul.sugg{list-style:none;margin:6px 0 0;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
  ul.sugg li{counter-increment:none;display:block;padding:0;margin:0;border:0;border-radius:0;background:none}
  ul.sugg li::before{content:none}
  ul.sugg li+li{border-top:1px solid var(--line)}
  ul.sugg button{width:100%;text-align:left;background:transparent;color:var(--ink);font-weight:500;border-radius:0;padding:12px 14px}
  ul.sugg button small{display:block;color:var(--mute);font-weight:400}
</style>
</head>
<body>
<main>
  <header><div class="logo" aria-hidden="true"></div><h1>Adressen sorteren<small>Van dichtbij naar ver, vanaf Sushi at Home</small></h1></header>

  <div class="panel">
    <label for="start">Startadres</label>
    <input id="start" value="Sushi at Home, 's-Hertogenbosch" autocomplete="off">

    <label for="city">Standaard plaats</label>
    <input id="city" value="'s-Hertogenbosch" autocomplete="off">
    <div class="hint">Wordt achter een adres gezet als je zelf geen plaats typt.</div>

    <label for="new">Adres toevoegen</label>
    <div class="add">
      <input id="new" placeholder="Bijv. Hinthamerstraat 45" autocomplete="off" autocapitalize="words" enterkeyhint="done">
      <button id="plus" type="button">Voeg toe</button>
    </div>
    <ul class="sugg" id="sugg" hidden></ul>
    <div class="hint">Typ de eerste letters van een straat en kies een suggestie. Na het huisnummer plus een spatie is het adres klaar.</div>

    <div class="count" id="count"></div>
    <div class="hint" id="edithint" hidden>Tik op een adres om het aan te passen.</div>
    <ul class="chips" id="chips"></ul>

    <label for="by">Sorteren op</label>
    <select id="by"><option value="d">Rijafstand</option><option value="t">Reistijd</option></select>

    <div class="row">
      <button id="go">Sorteer</button>
      <button id="copy" class="sec" hidden>Kopieer lijst</button>
      <button id="clear" class="sec">Alles wissen</button>
    </div>
  </div>
  <div id="status" role="status"></div>
  <button id="maps" class="big" hidden>Open in Google Maps</button>
  <ol id="out"></ol>
</main>

<script>
const $ = id => document.getElementById(id);
let entries = [];
let sorted = [];
try{ entries = JSON.parse(localStorage.getItem('entries')||'[]'); }catch(e){}
const cache = (()=>{ try{ return JSON.parse(localStorage.getItem('geo')||'{}'); }catch(e){ return {}; } })();
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmtKm = m => (m/1000).toFixed(1).replace('.',',') + ' km';
const fmtT = s => { const m=Math.round(s/60); return m<60 ? m+' min' : Math.floor(m/60)+' u '+(m%60)+' min'; };
const full = a => a.includes(',') ? a : a + ', ' + ($('city').value.trim() || '');
const save = () => { try{ localStorage.setItem('entries', JSON.stringify(entries)); }catch(e){} };

function render(){
  $('count').textContent = entries.length ? entries.length + (entries.length===1 ? ' adres' : ' adressen') : '';
  $('edithint').hidden = !entries.length;
  const ul = $('chips'); ul.innerHTML = '';
  entries.forEach((a,i)=>{
    const li = document.createElement('li');
    const sp = document.createElement('span'); sp.textContent = a; sp.title='Tik om aan te passen';
    sp.onclick = () => startEdit(li, sp, i);
    const b = document.createElement('button'); b.type='button'; b.textContent='×'; b.setAttribute('aria-label','Verwijder '+a);
    b.onclick = () => { entries.splice(i,1); save(); render(); };
    li.append(sp,b); ul.appendChild(li);
  });
}

function startEdit(li, sp, i){
  const inp = document.createElement('input');
  inp.className='edit'; inp.value=entries[i]; inp.enterKeyHint='done'; inp.autocapitalize='words';
  li.replaceChild(inp, sp); inp.focus(); inp.select();
  let done = false;
  const finish = ok => {
    if (done) return; done = true;
    const v = inp.value.trim();
    if (ok) { if (v) entries[i] = v; else entries.splice(i,1); }
    save(); render();
  };
  inp.addEventListener('keydown', e => {
    if (e.key==='Enter'){ e.preventDefault(); finish(true); }
    else if (e.key==='Escape') finish(false);
  });
  inp.addEventListener('blur', () => finish(true));
}

function add(text, place){
  let t = text.replace(/^\s*(\d+[.)]|[-*•])\s+/,'').trim();
  if (!t) return;
  if (place && !t.includes(',')) t += ', ' + place;
  if (!entries.some(e=>e.toLowerCase()===t.toLowerCase())) entries.push(t);
  save(); render();
}
function addMany(text){ text.split(/[\n;|]+/).forEach(x=>add(x)); }

/* suggesties rond Den Bosch, Empel, Rosmalen en Engelen */
let sTimer = 0, sSeq = 0;
function hideSugg(){ $('sugg').hidden = true; $('sugg').innerHTML = ''; }
function clearPlace(){ const n=$('new'); delete n.dataset.place; delete n.dataset.street; }
function addFromInput(){
  const n = $('new');
  add(n.value, n.dataset.place);
  n.value = ''; clearPlace(); hideSugg();
}

function toSuggestion(p){
  const city = p.city || p.district || p.locality || p.county || '';
  const hn = p.housenumber || '';
  if (p.street && hn) return {text:p.street+' '+hn, place:city, full:true, line:p.street+' '+hn, sub:city};
  if (p.osm_key==='highway' && p.name) return {text:p.name, place:city, full:false, line:p.name, sub:city};
  if (p.name && p.street) return {text:p.street+(hn?' '+hn:''), place:city, full:!!hn, line:p.name, sub:p.street+(hn?' '+hn:'')+', '+city};
  if (p.name) return {text:p.name, place:city, full:true, line:p.name, sub:city};
  return null;
}

async function suggest(q){
  const seq = ++sSeq;
  try{
    const url = 'https://photon.komoot.io/api/?q='+encodeURIComponent(q)
      +'&lat=51.69&lon=5.30&limit=10&bbox=5.15,51.60,5.50,51.78';
    const res = await fetch(url);
    const j = await res.json();
    if (seq !== sSeq) return;
    const seen = new Set(), list = [];
    (j.features||[]).forEach(f=>{
      const sg = toSuggestion(f.properties||{});
      if (!sg) return;
      const key = (sg.text+'|'+sg.place).toLowerCase();
      if (seen.has(key)) return;
      seen.add(key); list.push(sg);
    });
    renderSugg(list.slice(0,6));
  }catch(e){ if (seq===sSeq) hideSugg(); }
}

function renderSugg(list){
  const ul = $('sugg'); ul.innerHTML = '';
  if (!list.length){ ul.hidden = true; return; }
  list.forEach(sg=>{
    const li = document.createElement('li');
    const b = document.createElement('button'); b.type='button';
    b.append(document.createTextNode(sg.line));
    if (sg.sub){ const sm=document.createElement('small'); sm.textContent=sg.sub; b.appendChild(sm); }
    b.onclick = () => {
      const n = $('new');
      if (sg.full){ add(sg.text, sg.place); n.value=''; clearPlace(); hideSugg(); }
      else { n.value = sg.text+' '; n.dataset.place = sg.place; n.dataset.street = sg.text; hideSugg(); n.focus(); }
    };
    li.appendChild(b); ul.appendChild(li);
  });
  ul.hidden = false;
}

$('new').addEventListener('input', () => {
  const n = $('new'), v = n.value;
  if (!v.trim()){ clearPlace(); hideSugg(); return; }
  if (/[\n;|]/.test(v)){ addMany(v); n.value=''; clearPlace(); hideSugg(); return; }
  if (n.dataset.street && !v.startsWith(n.dataset.street)) clearPlace();
  if (/\S\s\d+[a-zA-Z]?(-\d+)?\s$/.test(v)){ addFromInput(); return; }
  clearTimeout(sTimer);
  if (n.dataset.place || v.trim().length < 3){ hideSugg(); return; }
  sTimer = setTimeout(() => suggest(v.trim()), 250);
});
$('new').addEventListener('paste', e => {
  const t = (e.clipboardData||window.clipboardData).getData('text');
  if (/[\n;|]/.test(t)){ e.preventDefault(); addMany(t); }
});
$('new').addEventListener('keydown', e => { if (e.key==='Enter'){ e.preventDefault(); addFromInput(); } });
$('plus').onclick = () => { addFromInput(); $('new').focus(); };
$('clear').onclick = () => { entries=[]; save(); render(); $('out').innerHTML=''; $('maps').hidden=$('copy').hidden=true; $('status').textContent=''; };
render();

async function geocode(q){
  if (cache[q]) return cache[q];
  const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q);
  const res = await fetch(url, {headers:{'Accept-Language':'nl'}});
  const j = await res.json();
  if (!j.length) return null;
  const p = {lat:+j[0].lat, lon:+j[0].lon};
  cache[q] = p;
  try{ localStorage.setItem('geo', JSON.stringify(cache)); }catch(e){}
  return p;
}

$('go').onclick = async () => {
  if ($('new').value.trim()) addFromInput();
  const start = $('start').value.trim();
  const lines = entries.slice();
  if (!start || !lines.length){ $('status').textContent='Vul een startadres en minstens één adres in.'; return; }
  if (lines.length > 90){ $('status').textContent='Maximaal 90 adressen tegelijk.'; return; }
  $('go').disabled = true; $('out').innerHTML=''; $('maps').hidden=$('copy').hidden=true;
  try{
    $('status').textContent='Startadres opzoeken…';
    const s = await geocode(start);
    if (!s){ $('status').textContent='Startadres niet gevonden. Vul het straatadres in.'; return; }

    const items=[];
    for (let i=0;i<lines.length;i++){
      $('status').textContent=`Adressen opzoeken ${i+1} van ${lines.length}…`;
      const q = full(lines[i]);
      const wasCached = !!cache[q];
      const p = await geocode(q);
      items.push({addr:lines[i], q, p, d:null, t:null});
      if (!wasCached) await sleep(1100);
    }

    const ok = items.filter(x=>x.p);
    if (ok.length){
      $('status').textContent='Rijafstanden berekenen…';
      const coords = [s, ...ok.map(x=>x.p)].map(p=>p.lon+','+p.lat).join(';');
      const url = 'https://router.project-osrm.org/table/v1/driving/'+coords+'?sources=0&annotations=distance,duration';
      const res = await fetch(url);
      const j = await res.json();
      if (j.code !== 'Ok'){ $('status').textContent='Routedienst gaf een fout. Probeer het zo opnieuw.'; return; }
      ok.forEach((x,i)=>{ x.d = j.distances[0][i+1]; x.t = j.durations[0][i+1]; });
    }

    const k = $('by').value;
    sorted = ok.filter(x=>x.d!=null).sort((a,b)=>a[k]-b[k]);
    const bad = items.filter(x=>x.d==null);

    const frag = document.createDocumentFragment();
    sorted.forEach(x=>{
      const li=document.createElement('li');
      li.innerHTML='<span></span><span class="km"></span>';
      li.children[0].textContent=x.addr;
      li.children[1].textContent=fmtKm(x.d)+' · '+fmtT(x.t);
      frag.appendChild(li);
    });
    bad.forEach(x=>{
      const li=document.createElement('li'); li.className='err';
      li.innerHTML='<span></span><span class="km">niet gevonden</span>';
      li.children[0].textContent=x.addr; frag.appendChild(li);
    });
    $('out').appendChild(frag);
    $('status').textContent='Klaar. Gesorteerd van dichtbij naar ver.';
    $('maps').hidden=$('copy').hidden=!sorted.length;
    $('start').dataset.s=start;
  }catch(e){
    $('status').textContent='Er ging iets mis. Controleer je internetverbinding.';
  }finally{ $('go').disabled=false; }
};

$('maps').onclick = () => {
  const start=$('start').dataset.s;
  let stops=sorted.map(x=>x.q);
  if (stops.length > 10){ stops=stops.slice(0,10); $('status').textContent='Google Maps neemt maximaal 10 stops; de eerste 10 zijn doorgestuurd.'; }
  const dest=stops.pop();
  const u='https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(start)
    +'&destination='+encodeURIComponent(dest)
    +(stops.length?'&waypoints='+encodeURIComponent(stops.join('|')):'')
    +'&travelmode=driving';
  window.location.href=u;
};

$('copy').onclick = async () => {
  const t=sorted.map((x,i)=>`${i+1}. ${x.addr} (${fmtKm(x.d)}, ${fmtT(x.t)})`).join('\n');
  try{ await navigator.clipboard.writeText(t); $('status').textContent='Gekopieerd.'; }
  catch(e){ $('status').textContent='Kopiëren mislukt.'; }
};
</script>
</body>
</html>
